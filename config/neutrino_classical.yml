limitations:
- Inner fit/tuning groups come only from the original 800 training observations; the
  population prior excludes tuning groups during selection.
- Settings are selected by mean cross entropy over nonempty inner-training B targets,
  then locked before outer validation photons are opened.
- After selection the population prior is refitted on all 800 training observations;
  no outer validation data are used for refitting.
- Count-adaptive Gaussian kernels use Scott-style N^(-1/(d+4)) scaling with grid-selected
  physical base bandwidths, not automatic sample covariance fitting.
- Poisson-TV regularizes time and physical vertical detector-string neighbors; it
  is not a general full-Cherenkov likelihood reconstruction.
- Numerically nonconverged TV candidates are explicitly excluded from selection; selected
  evaluation uses the same gap tolerance with a declared refinement ceiling.
- All estimates use population-prior shrinkage for positive live-support predictive
  probabilities; empty observations return the prior.
- Scores compare normalized photon-arrival distributions, not absolute event rates
  or neutrino detection performance.
- This reuses the same small 100-event simulation validation cohort. Intervals condition
  on fitted choices and exclude selection/seed uncertainty.
- The earlier frozen mixture had been tuned on earlier validation; it is reported
  as a historical comparator rather than a newly training-selected method.
- No clean photon ground truth, test observations, MC truth, PSNR or target-derived
  inference scaling is used.
