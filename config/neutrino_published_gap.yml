adaptations_and_limits:
- Released GAP U-Net at paper dimensions; this is a detector-data transfer, not a
  reproduction of the microscopy benchmark.
- Sensors are lexicographically ordered by physical x/y/z into a sensor/time image;
  this differs from physical 4D adjacency.
- Zero padding to pooling multiples is cropped before live-support probability normalization.
- Whole 60-by-256 event observations replace random 256-by-256 image crops; image
  flips/transposes are omitted because sensor and time axes are not exchangeable.
- Fixed p=.5 and training-only fitting are shared with the 4D comparator; original
  variable-thinning microscopy schedule is not replicated.
- Paper setup uses batch 32, Adam 1e-4, clip .5, and epoch-wise ReduceLROnPlateau;
  matched setup uses batch 16 and the 4D AdamW optimizer. Both see 80000 training
  examples over 100 epochs; the matched setup changes both optimizer and batch size.
- Final fixed-step scores are reported for both setups without best-checkpoint or
  optimizer selection.
- This reuses the same 100-event simulation validation cohort; descriptive intervals
  exclude seed/selection uncertainty and do not establish real-event detection.
- No clean photon GT, test observations, MC truth, intensity matching or PSNR is used.
- Parameter counts and compute differ; actual training times and peak GPU allocations
  are reported.
