[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssunet"
version = "0.1.0"
description = "Parametric self-Supervised U-Net for denoising binary images."
authors = [{ name = "Yehe Liu", email = "yehe@case.edu" }]
license = { text = "MIT License" }
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "lightning",
    "numpy",
    "h5py",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "seaborn",
    "pandas",
    "pyiqa",
    "setuptools>=70,<72",
    "torch-convnd",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "tox", "pre-commit"]
# The pipelines' tools and scripts import more than the core model needs.
confocal = ["dask", "defusedxml", "napari[all]", "qtpy", "readlif", "torch-convnd[native]"]
neutrino = ["plotly", "torch-convnd[native]"]
spad = [
    "napari[all]",
    "visionsim>=0.1.0a2",
    # torch.compile on Windows; 3.6 is the Triton release for torch 2.10.
    "triton-windows>=3.6,<3.7; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ssunet", "src/tools"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["*.ipynb"]
extend-exclude = ["src/ssunet/vendor/gap"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "S",   # bandit
    "BLE", # flake8-blind-except
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RUF", # Ruff-specific rules
    "DTZ", # flake8-datetimez
    "ERA", # eradicate
    "TRY", # tryceratops
    "C90", # mccabe
]
ignore = ["D100", "D104", "D107"]

[tool.ruff.lint.isort]
known-first-party = ["ssunet"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]
# Top-level research scripts report progress with print.
"!{src,tests}/**" = ["T201"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torch-convnd = { path = "../torch-convnd", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
